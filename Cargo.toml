[package]
name = "triad"
version = "0.1.0"
edition = "2024"
description = "Local multi-provider AI review harness"
license = "MIT"
repository = "https://github.com/nocell/triad-harness"
readme = "README.md"
rust-version = "1.85"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
fs2 = "0.4"
futures = "0.3"
nix = { version = "0.30", features = ["signal", "process"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
uuid = { version = "1", features = ["v7", "serde"] }
which = "8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
strip = true
lto = "thin"
